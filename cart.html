<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Farmacia Salud - Carrito</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <a href="index.html" class="brand">
          <div class="brand-mark">+</div>
          <div>
            <span class="brand-name">Farmacia</span>
            <small>Salud</small>
          </div>
        </a>

        <div class="search-bar">
          <input type="text" placeholder="Buscar" />
          <button>Buscar</button>
        </div>

        <nav class="nav-links">
          <a href="index.html">Inicio</a>
          <a href="index.html#catalog">Catálogo</a>
          <a href="index.html#location">Ubicación</a>
          <a href="index.html#contact">Contáctenos</a>
          <a href="cart.html" class="cart-link">Carrito <span class="cart-count">0</span></a>
        </nav>
      </header>

      <section class="cart-page-section">
        <div class="section-header">
          <span class="section-label">Tu carrito</span>
          <h2>Revisa tu orden</h2>
          <p>Aquí puedes modificar las cantidades, eliminar productos o completar tu compra.</p>
        </div>

        <div class="cart-panel">
          <div class="cart-items"></div>
          <div class="cart-summary">
            <span>Total</span>
            <strong class="cart-total">$0</strong>
          </div>
          <button class="button primary checkout-button" onclick="checkout()" disabled>Finalizar compra</button>
          <button class="button secondary cart-clear-button" onclick="clearCart()" disabled>Vaciar carrito</button>
        </div>
      </section>
    </div>

    <script src="cart.js"></script>
  </body>
</html>
