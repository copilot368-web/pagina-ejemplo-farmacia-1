<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Farmacia Salud - Productos</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <a href="index.html" class="brand">
          <img class="brand-logo" src="visuales/logo.jpg" alt="Farmacia Salud" />
          <div>
            <span class="brand-name">Farmacia</span>
            <small>Salud</small>
          </div>
        </a>

        <div class="search-bar">
          <input type="text" placeholder="Buscar" />
          <button type="button" aria-label="Buscar" class="search-button">🔍</button>
        </div>

        <nav class="nav-links">
          <a href="productos.html">Productos</a>
          <a href="index.html#contact">Consúltanos</a>
        </nav>
      </header>

      <main class="main-grid">
        <section class="catalog-section" id="catalog">
          <div class="section-header">
            <span class="section-label">Productos</span>
            <h2>Catálogo de productos</h2>
            <p>Explora todos los productos disponibles en la tienda.</p>
          </div>
          <div class="catalog-layout">
            <aside class="filters-panel">
              <div class="filter-group">
                <p class="filter-title">Filtrar por categoría</p>
                <label><input type="checkbox" name="category" value="higiene" checked /> Higiene</label>
                <label><input type="checkbox" name="category" value="infantil" checked /> Infantil</label>
                <label><input type="checkbox" name="category" value="cosmetica" checked /> Cosmética</label>
              </div>
            </aside>
            <div class="products-grid"></div>
          </div>
        </section>
      </main>
    </div>

    <button type="button" class="cart-bubble" aria-label="Abrir carrito" onclick="openCartPopup()">
      <span class="bubble-icon">🛒</span>
      <span class="cart-bubble-count">0</span>
    </button>

    <div id="cart-modal" class="cart-modal" aria-hidden="true">
      <div class="cart-modal-backdrop" onclick="closeCartPopup()"></div>
      <div class="cart-modal-panel">
        <div class="cart-modal-header">
          <h2>Tu carrito</h2>
          <button type="button" class="cart-modal-close" onclick="closeCartPopup()" aria-label="Cerrar carrito">×</button>
        </div>
        <div class="cart-modal-body">
          <div class="cart-items"></div>
          <div class="cart-summary">
            <span>Total</span>
            <strong class="cart-total">$0</strong>
          </div>
          <button type="button" class="button primary checkout-button" onclick="checkout()">Finalizar compra</button>
          <button type="button" class="button secondary cart-clear-button" onclick="clearCart()">Vaciar carrito</button>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
